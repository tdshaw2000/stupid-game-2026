schema: spec-driven

context: |
  Stupid Game is a dependency-free static web app (index.html, styles.css, app.js); keep it that way: no build step, framework or backend unless explicitly proposed.
  It is played mostly on phones passed between two people, so every change must work on real mobile browsers (avoid 100vh layouts and the native keyboard during play).
  Avoid browser dialogs such as window.confirm/alert; they fail silently in sandboxed previews. Use in-page overlays.
  There are no automated tests; tasks should include checking the change by playing in a browser at phone width.
  See openspec/project.md for the overview and history.

